# ============================================================
# Configuración de la aplicación - Innovatech Chile
# Las credenciales se inyectan como variables de entorno
# NUNCA hardcodear contraseñas aquí
# ============================================================

# Nombre de la aplicación
spring.application.name=backend-despachos

# Puerto del servidor
server.port=8081

# ============================================================
# Configuración de la base de datos MySQL
# Las variables ${VAR_NAME} se leen desde el entorno o docker-compose
# ============================================================
spring.datasource.url=jdbc:mysql://${DB_ENDPOINT:localhost}:${DB_PORT:3306}/${DB_NAME:despachos_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ============================================================
# Configuración de JPA/Hibernate
# ============================================================
# update: actualiza el esquema automáticamente (útil en desarrollo)
# validate: solo valida sin cambiar (para producción strict)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ============================================================
# Logging
# ============================================================
logging.level.com.innovatech=INFO
logging.level.org.springframework.web=WARN
